<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syntetisk Dronning - Vektor Visualisering</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  </head>
  <body>
    <div
      id="vectorPlot"
      style="width: 800px; height: 500px; margin: 0 auto"
    ></div>

    <script>
      dataPoints = [
        {
          label: 'Konge',
          x: 0.04,
          y: -0.02,
          z: -0.31,
          color: '#3498db',
          type: 'base',
        },
        {
          label: 'Mann',
          x: 0.4,
          y: 0.34,
          z: -0.08,
          color: '#95a5a6',
          type: 'base',
        },
        {
          label: 'Kvinne',
          x: 0.38,
          y: 0.06,
          z: 0.29,
          color: '#95a5a6',
          type: 'base',
        },
        {
          label: 'Dronning',
          x: 0.02,
          y: -0.24,
          z: -0.04,
          color: '#f1c40f',
          type: 'target',
        },
        {
          label: 'Resultat',
          x: 0.01,
          y: -0.31,
          z: 0.06,
          color: '#2ecc71',
          type: 'calculated',
        },
        {
          label: 'Konge - Mann',
          x: -0.86,
          y: 0.18,
          z: 0.07,
          color: '#e67e22',
          type: 'calculated',
        },
      ]

      trace = {
        x: dataPoints.map((p) => p.x),
        y: dataPoints.map((p) => p.y),
        z: dataPoints.map((p) => p.z),
        mode: 'markers+text',
        type: 'scatter3d',
        text: dataPoints.map((p) => p.label),
        textposition: 'top center',
        marker: {
          size: 8,
          color: dataPoints.map((p) => p.color),
          opacity: 0.8,
        },
      }

      layout = {
        margin: { l: 0, r: 0, b: 0, t: 0 },
        scene: {
          xaxis: { title: 'PCA 1' },
          yaxis: { title: 'PCA 2' },
          zaxis: { title: 'PCA 3' },
        },
      }

      plotlyConfig = { displayModeBar: false }
      Plotly.newPlot('vectorPlot', [trace], layout, plotlyConfig)
    </script>
  </body>
</html>
